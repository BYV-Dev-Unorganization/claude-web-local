name: CI

on:
  push:
    branches: [feat/full-claude-web-local]
  pull_request:
    branches: [feat/full-claude-web-local, docs/full-planning-claude-web-local]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
